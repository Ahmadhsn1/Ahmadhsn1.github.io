name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Posts dated in the future are hidden by the build (see vite.config.js). A daily deploy at 04:15 UTC, which is
  # 09:15 in Pakistan, publishes the ones whose time has come. GitHub may start scheduled runs a few minutes late.
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy mid-flight; a newer push simply queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      upload-pages-artifact: true

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Smoke test live site
    needs: [ci, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/', github.repository_owner) }}
    steps:
      # The CDN can lag the deploy by a few seconds, so retry until the live HTML references the exact
      # script bundle this commit built. That proves the new version, not a cached one, is being served.
      - name: Live site serves this build
        env:
          EXPECTED: ${{ needs.ci.outputs.bundle }}
        run: |
          test -n "$EXPECTED"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS -H 'Cache-Control: no-cache' "$PAGE_URL" | grep -q "assets/$EXPECTED"; then
              echo "Live site is serving $EXPECTED"
              exit 0
            fi
            echo "Attempt $attempt: live site not serving $EXPECTED yet"
            sleep 10
          done
          exit 1

      - name: Key URLs respond
        run: |
          fail=0
          for path in "" robots.txt sitemap.xml llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${PAGE_URL}${path}")
            echo "$code  /${path}"
            [ "$code" = 200 ] || fail=1
          done
          for url in $(curl -fsS "${PAGE_URL}sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$code  $url"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail

  # Tells Bing, Yandex and other IndexNow search engines about every page right after a deploy.
  indexnow:
    name: Notify IndexNow
    needs: [deploy, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/', github.repository_owner) }}
      INDEXNOW_KEY: e280f8b4342d70583e86f664101f1dba
    steps:
      - run: |
          host=$(echo "$PAGE_URL" | sed -E 's#https?://([^/]+)/?.*#\1#')
          sitemap=$(curl -fsS "${PAGE_URL}sitemap.xml" | tr -d '\n\t' | sed 's#</url>#</url>\n#g')
          # The daily scheduled deploy only announces pages whose lastmod is today, so quiet days send nothing.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            sitemap=$(echo "$sitemap" | grep "<lastmod>$(date -u +%F)</lastmod>" || true)
          fi
          urls=$(echo "$sitemap" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          if [ "$(echo "$urls" | jq length)" = "0" ]; then
            echo "No new pages to announce"
            exit 0
          fi
          jq -n --arg host "$host" --arg key "$INDEXNOW_KEY" --arg loc "${PAGE_URL}${INDEXNOW_KEY}.txt" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}' \
            | curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d @-
